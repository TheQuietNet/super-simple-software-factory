name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pydantic: templates/adws/adw_modules/data_types.py imports it, so any
      # test that imports the gate modules cannot be collected without it
      # (#52974 — sssf#1 sat red on ModuleNotFoundError: pydantic).
      - name: Install test deps
        run: python -m pip install --disable-pip-version-check pytest pydantic

      # Skill-template tests live under .claude/skills/sssf/tests (added by
      # #52882). Until that PR lands this job still needs a collected test so
      # pytest does not exit 5 (no tests) and fail-open the check.
      - name: Run SSSF tests
        run: python -m pytest .claude/skills/sssf/tests -q

name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      # Skill-template tests live under .claude/skills/sssf/tests (added by
      # #52882). Until that PR lands this job still needs a collected test so
      # pytest does not exit 5 (no tests) and fail-open the check.
      - name: Run SSSF tests
        run: python -m pytest .claude/skills/sssf/tests -q

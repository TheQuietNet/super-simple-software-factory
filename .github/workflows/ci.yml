name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every third-party import under templates/adws (enumerated, not chased
      # one ModuleNotFoundError at a time — #52974 first shipped pydantic alone
      # and CI then died on dotenv): pydantic (data_types), pyyaml (agents),
      # rich (console), python-dotenv (utils). Any test that imports the gate
      # modules pulls this whole chain in at collection time.
      - name: Install test deps
        run: python -m pip install --disable-pip-version-check pytest pydantic pyyaml rich python-dotenv

      # Skill-template tests live under .claude/skills/sssf/tests (added by
      # #52882). Until that PR lands this job still needs a collected test so
      # pytest does not exit 5 (no tests) and fail-open the check.
      - name: Run SSSF tests
        run: python -m pytest .claude/skills/sssf/tests -q
